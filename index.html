<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16130F" />
  <title>OUROBORO</title>
  <meta name="description" content="Jogo da cobrinha em que o corpo e a moeda de energia. Gastar poder encolhe a cobra." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316130F'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23D9A441' stroke-width='4' stroke-dasharray='52 12'/%3E%3Ccircle cx='24' cy='19' r='3.4' fill='%23F2C464'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #16130F;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    /* O gesto so e capturado sobre o tabuleiro. Os menus precisam rolar,
       entao touch-action fica no palco, nunca no documento inteiro. */
    #stage {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      touch-action: none;
      box-sizing: border-box;
    }
    #game {
      display: block;
      margin: 0 auto;
      image-rendering: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Sonda invisivel para ler as safe areas do aparelho em pixels. */
    #safe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>
</head>
<body>
  <div id="safe"></div>
  <div id="stage"><canvas id="game"></canvas></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
